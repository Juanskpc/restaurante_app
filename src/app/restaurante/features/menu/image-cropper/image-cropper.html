<div class="cropper-overlay">
  <div class="cropper-modal" (click)="$event.stopPropagation()">

    <div class="cropper-header">
      <h2 class="cropper-title">
        <lucide-icon name="crop" [size]="18" />
        {{ titulo() }}
      </h2>
      <button class="close-btn" type="button" (click)="cancelar()">
        <lucide-icon name="x" [size]="18" />
      </button>
    </div>

    <div class="cropper-body">
      <p class="cropper-hint">Arrastra para mover y usa el zoom para encuadrar. Así se verá en la tarjeta.</p>

      <div
        #viewport
        class="cropper-viewport"
        [style.aspect-ratio]="aspect()"
        (pointerdown)="onPointerDown($event)"
      >
        @if (objectUrl()) {
          <img
            class="cropper-image"
            [src]="objectUrl()"
            alt="Imagen a recortar"
            draggable="false"
            [style.left.px]="imgLeft()"
            [style.top.px]="imgTop()"
            [style.width.px]="dispW()"
            [style.height.px]="dispH()"
          />
        }
        @if (cargando()) {
          <div class="cropper-loading">
            <lucide-icon name="loader" [size]="28" class="spinner" />
          </div>
        }
        <div class="cropper-frame"></div>
      </div>

      <div class="cropper-zoom">
        <button class="zoom-btn" type="button" (click)="setZoom(zoom() - 0.2)" [disabled]="cargando()">
          <lucide-icon name="minus" [size]="16" />
        </button>
        <input
          class="zoom-slider"
          type="range"
          min="1"
          max="5"
          step="0.01"
          [value]="zoom()"
          [disabled]="cargando()"
          (input)="onZoomInput($event)"
          aria-label="Zoom"
        />
        <button class="zoom-btn" type="button" (click)="setZoom(zoom() + 0.2)" [disabled]="cargando()">
          <lucide-icon name="plus" [size]="16" />
        </button>
      </div>
    </div>

    <div class="cropper-footer">
      <button class="btn btn-ghost" type="button" (click)="cancelar()">Cancelar</button>
      <button class="btn btn-primary" type="button" (click)="confirmar()" [disabled]="cargando() || procesando()">
        @if (procesando()) { <lucide-icon name="loader" [size]="16" class="spinner" /> }
        Aplicar imagen
      </button>
    </div>

  </div>
</div>
